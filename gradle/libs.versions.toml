[versions]

# Minecraft
minecraft = "1.21.6-pre2"
fabric-api = "0.125.3"
neoforge = "21.6.0-beta"

# Libraries
yabn = "1.0.3"
bytecodecs = "1.1.3"

# Plugins
resourceful-loom = "1.0.4"

[libraries]

yabn = { module = "com.teamresourceful:yabn", version.ref = "yabn" }
bytecodecs = { module = "com.teamresourceful:bytecodecs", version.ref = "bytecodecs" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version = "0.125.3+1.21.6" }
# TODO remove the above when actual release as gradle toolkit auto does it

[plugins]

resourceful-loom = { id = "com.teamresourceful.plugins.loom", version.ref = "resourceful-loom" }
resourceful-gradle = { id = "com.teamresourceful.resourcefulgradle" }